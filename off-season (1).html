<title>Off Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Space+Mono:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3E9CE;
    --paper-deep:#EBD9A8;
    --card:#FFFBEF;
    --ink:#1B1710;
    --ink-soft:#5A4E2E;
    --teal:#00A896;
    --violet:#7B3FE4;
    --rust:#F03A1F;
    --mustard:#FFB627;
    --pink:#FF3D8A;
    --blue:#1E7FEE;
    --line: rgba(27,23,16,0.18);
    --line-strong: rgba(27,23,16,0.55);
  }
  :root:not([data-theme="light"]){
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#181109;
      --paper-deep:#241708;
      --card:#241A0F;
      --ink:#FBF1DA;
      --ink-soft:#D8C696;
      --teal:#2FE0C7;
      --violet:#B285FF;
      --rust:#FF6A4D;
      --mustard:#FFCA4D;
      --pink:#FF6BAE;
      --blue:#5FA6FF;
      --line: rgba(251,241,218,0.18);
      --line-strong: rgba(251,241,218,0.5);
    }
  }
  :root[data-theme="dark"]{
    --paper:#181109;
    --paper-deep:#241708;
    --card:#241A0F;
    --ink:#FBF1DA;
    --ink-soft:#D8C696;
    --teal:#2FE0C7;
    --violet:#B285FF;
    --rust:#FF6A4D;
    --mustard:#FFCA4D;
    --pink:#FF6BAE;
    --blue:#5FA6FF;
    --line: rgba(251,241,218,0.18);
    --line-strong: rgba(251,241,218,0.5);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Archivo', sans-serif;
    background-image:
      radial-gradient(circle, var(--line) 1px, transparent 1.4px),
      radial-gradient(circle at 8% 6%, color-mix(in srgb, var(--pink) 30%, transparent) 0%, transparent 32%),
      radial-gradient(circle at 92% 18%, color-mix(in srgb, var(--blue) 26%, transparent) 0%, transparent 34%),
      radial-gradient(circle at 20% 92%, color-mix(in srgb, var(--teal) 24%, transparent) 0%, transparent 30%),
      radial-gradient(circle at 80% 78%, color-mix(in srgb, var(--violet) 24%, transparent) 0%, transparent 32%);
    background-size:14px 14px, auto, auto, auto, auto;
    background-attachment:fixed, fixed, fixed, fixed, fixed;
  }
  h1,h2,h3{margin:0; font-family:'Anton', 'Archivo', sans-serif; font-weight:400; text-transform:uppercase; letter-spacing:0.01em; text-wrap:balance;}
  p{line-height:1.6;}
  a{color:inherit;}
  img,svg{max-width:100%; display:block;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
  .eyebrow{
    font-family:'Space Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.14em;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  ::selection{background:var(--rust); color:var(--paper);}
  :focus-visible{outline:2px solid var(--rust); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 28px;
    border-bottom:3px solid var(--ink);
    background:var(--paper);
    position:sticky; top:0; z-index:40;
  }
  .brand{
    font-family:'Anton', sans-serif;
    font-size:1.5rem;
    letter-spacing:0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .brand .dot{width:9px; height:9px; border-radius:50%; background:var(--rust);}
  nav{display:flex; gap:6px;}
  nav a{
    font-family:'Space Mono', monospace;
    text-decoration:none;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.07em;
    padding:8px 12px;
    border:1.5px solid transparent;
    border-radius:3px;
  }
  nav a:hover{border-color:var(--ink); background:var(--card);}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:76px 28px 60px;
    overflow:hidden;
    border-bottom:3px solid var(--ink);
  }
  .hero-inner{
    max-width:1180px; margin:0 auto;
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:50px;
    align-items:center;
  }
  .hero-badge{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    background:linear-gradient(100deg, var(--rust), var(--pink));
    color:#fff;
    padding:6px 14px;
    transform:rotate(-2deg);
    margin-bottom:22px;
    border:2px solid var(--ink);
  }
  .hero h1{
    font-size:clamp(3rem, 8.2vw, 6.2rem);
    line-height:0.86;
    display:flex; flex-direction:column;
  }
  .hero h1 .line2{
    margin-top:4px;
    background:linear-gradient(100deg, var(--rust) 10%, var(--pink) 55%, var(--violet) 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero .marker{
    font-family:'Permanent Marker', cursive;
    text-transform:none;
    font-size:1.15rem;
    color:var(--violet);
    display:inline-block;
    transform:rotate(-3deg);
    margin-top:10px;
  }
  .hero p.lede{
    max-width:460px;
    margin:22px 0 0;
    font-size:1.05rem;
    color:var(--ink-soft);
  }
  .cta-row{margin-top:32px; display:flex; gap:14px; flex-wrap:wrap;}
  .btn{
    font-family:'Space Mono', monospace;
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-size:0.78rem;
    font-weight:700;
    padding:14px 24px;
    text-decoration:none;
    border-radius:3px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:2px solid var(--ink);
    transition:transform .12s ease;
    cursor:pointer;
  }
  .btn:active{transform:translateY(1px);}
  .btn-solid{background:var(--ink); color:var(--paper);}
  .btn-solid:hover{background:var(--rust); border-color:var(--rust); color:#fff;}
  .btn-outline{background:transparent; color:var(--ink);}
  .btn-outline:hover{background:var(--card);}
  .btn-mini{
    font-family:'Space Mono', monospace;
    font-size:0.68rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:8px 12px;
    border:1.5px solid var(--ink);
    border-radius:3px;
    text-decoration:none;
    white-space:nowrap;
  }
  .btn-mini:hover{background:var(--ink); color:var(--paper);}

  /* hero visual: poster-style polaroid stack */
  .hero-visual{position:relative; height:420px;}
  .polaroid{
    position:absolute;
    background:var(--card);
    border:2px solid var(--ink);
    padding:10px 10px 34px;
    box-shadow:6px 6px 0 var(--line-strong);
  }
  .polaroid .frame{
    aspect-ratio:3/4;
    background:
      repeating-linear-gradient(135deg, var(--frame-tint, var(--paper-deep)), var(--frame-tint, var(--paper-deep)) 10px, var(--paper) 10px, var(--paper) 20px);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .p1 .frame{--frame-tint: color-mix(in srgb, var(--rust) 30%, var(--paper-deep));}
  .p2 .frame{--frame-tint: color-mix(in srgb, var(--teal) 28%, var(--paper-deep));}
  .p3 .frame{--frame-tint: color-mix(in srgb, var(--violet) 28%, var(--paper-deep));}
  .polaroid .frame img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .polaroid .frame span{
    font-family:'Space Mono', monospace;
    font-size:0.62rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    padding:0 12px;
  }
  .polaroid .cap{
    font-family:'Permanent Marker', cursive;
    font-size:0.9rem;
    text-align:center;
    margin-top:10px;
  }
  .p1{width:56%; top:0; left:6%; transform:rotate(-6deg); z-index:2;}
  .p1 .cap{color:var(--rust);}
  .p2{width:50%; top:14%; right:2%; transform:rotate(5deg); z-index:1;}
  .p2 .cap{color:var(--teal);}
  .p3{width:40%; bottom:0; left:22%; transform:rotate(3deg); z-index:3;}
  .p3 .cap{color:var(--violet);}

  /* ---------- SECTION HEAD ---------- */
  .section-head{text-align:center; max-width:640px; margin:0 auto 44px;}
  .section-head h2{font-size:clamp(1.9rem, 4vw, 2.7rem); margin:10px 0 12px;}
  .section-head p{color:var(--ink-soft); font-size:0.98rem;}

  /* ---------- GET THE LOOK ---------- */
  .looks{padding:80px 28px; border-bottom:3px solid var(--ink); background:var(--paper-deep); position:relative;}
  .look-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:34px;}
  .look-card{
    background:var(--card);
    border:2px solid var(--ink);
    box-shadow:7px 7px 0 var(--line-strong);
    display:flex;
    overflow:hidden;
  }
  .look-photo img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  .ref-badge{
    position:absolute; bottom:8px; left:8px; right:8px; z-index:2;
    font-family:'Space Mono', monospace;
    font-size:0.56rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:#fff;
    background:rgba(27,23,16,0.72);
    padding:5px 8px;
    line-height:1.35;
  }
  .look-photo{
    flex:0 0 42%;
    position:relative;
    background:
      repeating-linear-gradient(45deg, var(--tint, var(--paper-deep)), var(--tint, var(--paper-deep)) 9px, var(--paper) 9px, var(--paper) 18px);
    border-right:2px solid var(--ink);
    display:flex; align-items:center; justify-content:center; text-align:center;
    min-height:280px;
  }
  .look-card:nth-child(1) .look-photo{--tint: color-mix(in srgb, var(--mustard) 38%, var(--paper-deep));}
  .look-card:nth-child(2) .look-photo{--tint: color-mix(in srgb, var(--pink) 34%, var(--paper-deep));}
  .look-card:nth-child(3) .look-photo{--tint: color-mix(in srgb, var(--blue) 30%, var(--paper-deep));}
  .look-card:nth-child(4) .look-photo{--tint: color-mix(in srgb, var(--teal) 32%, var(--paper-deep));}
  .look-photo span{
    font-family:'Space Mono', monospace;
    font-size:0.64rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    padding:0 16px;
  }
  .look-num{
    position:absolute; top:10px; left:10px;
    font-family:'Anton', sans-serif;
    font-size:1.6rem;
    color:var(--ink);
    background:var(--mustard);
    padding:2px 10px;
    border:2px solid var(--ink);
    z-index:3;
  }
  .look-card:nth-child(1) .look-num{background:var(--mustard);}
  .look-card:nth-child(2) .look-num{background:var(--pink); color:#fff;}
  .look-card:nth-child(3) .look-num{background:var(--blue); color:#fff;}
  .look-card:nth-child(4) .look-num{background:var(--teal); color:#fff;}
  .look-card:nth-child(1) .look-total b{color:var(--rust);}
  .look-card:nth-child(2) .look-total b{color:var(--pink);}
  .look-card:nth-child(3) .look-total b{color:var(--blue);}
  .look-card:nth-child(4) .look-total b{color:var(--teal);}
  .look-card:nth-child(1) .item-list .iprice{color:var(--rust);}
  .look-card:nth-child(2) .item-list .iprice{color:var(--pink);}
  .look-card:nth-child(3) .item-list .iprice{color:var(--blue);}
  .look-card:nth-child(4) .item-list .iprice{color:var(--teal);}

  .look-card.actuel{grid-column:1 / -1;}
  .look-card.actuel .look-photo{flex:0 0 30%; --tint:var(--paper-deep) !important;}
  .look-card.actuel .look-num{
    background:var(--card); color:var(--ink);
    border:2px dashed var(--ink);
  }
  .look-card.actuel .look-total b{color:var(--ink);}
  .look-card.actuel .item-list .iprice{color:var(--ink);}
  .look-card.actuel .look-sub{color:var(--ink-soft);}
  .look-card.actuel .btn-mini{border-style:dashed;}
  .look-body{flex:1; padding:22px 22px 20px; display:flex; flex-direction:column;}
  .look-title{font-size:1.4rem; margin-bottom:4px;}
  .look-sub{font-family:'Space Mono', monospace; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:14px;}
  .item-list{list-style:none; margin:0 0 16px; padding:0; display:flex; flex-direction:column; gap:8px; border-top:1px dashed var(--line-strong); padding-top:12px;}
  .item-list li{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    font-size:0.86rem;
  }
  .item-list .iname{color:var(--ink);}
  .item-list .iprice{font-family:'Space Mono', monospace; font-weight:700; color:var(--rust); white-space:nowrap;}
  .look-foot{
    margin-top:auto;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-top:2px solid var(--ink); padding-top:14px;
  }
  .look-total{font-family:'Space Mono', monospace; font-size:0.82rem;}
  .look-total b{font-size:1.15rem; color:var(--rust);}

  /* ---------- CATALOGUE ---------- */
  .catalog{padding:80px 28px 40px;}
  .filters{display:flex; justify-content:center; gap:9px; flex-wrap:wrap; margin-bottom:46px;}
  .filter-btn{
    font-family:'Space Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    background:transparent;
    border:1.5px solid var(--ink);
    padding:8px 15px;
    border-radius:20px;
    cursor:pointer;
    color:var(--ink);
  }
  .filter-btn.active, .filter-btn:hover{background:var(--ink); color:var(--paper);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:30px; padding-bottom:30px;}
  .tag{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:2px;
    padding:16px 16px 18px;
    box-shadow:5px 5px 0 var(--line-strong);
    position:relative;
  }
  .tag .corner{
    position:absolute; top:-2px; right:-2px;
    width:34px; height:34px;
    background:var(--teal);
    border-left:2px solid var(--ink);
    border-bottom:2px solid var(--ink);
    clip-path:polygon(100% 0, 0 0, 100% 100%);
  }
  .tag:nth-child(6n+2) .corner{background:var(--violet);}
  .tag:nth-child(6n+3) .corner{background:var(--mustard);}
  .tag:nth-child(6n+4) .corner{background:var(--pink);}
  .tag:nth-child(6n+5) .corner{background:var(--blue);}
  .tag:nth-child(6n+6) .corner{background:var(--rust);}
  .icon-box{
    height:120px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px;
    background:
      repeating-linear-gradient(45deg, var(--icon-tint, var(--paper-deep)), var(--icon-tint, var(--paper-deep)) 8px, var(--paper) 8px, var(--paper) 16px);
    border:1px solid var(--line);
  }
  .tag:nth-child(6n+1) .icon-box{--icon-tint: color-mix(in srgb, var(--teal) 26%, var(--paper-deep));}
  .tag:nth-child(6n+2) .icon-box{--icon-tint: color-mix(in srgb, var(--violet) 26%, var(--paper-deep));}
  .tag:nth-child(6n+3) .icon-box{--icon-tint: color-mix(in srgb, var(--mustard) 30%, var(--paper-deep));}
  .tag:nth-child(6n+4) .icon-box{--icon-tint: color-mix(in srgb, var(--pink) 26%, var(--paper-deep));}
  .tag:nth-child(6n+5) .icon-box{--icon-tint: color-mix(in srgb, var(--blue) 26%, var(--paper-deep));}
  .tag:nth-child(6n+6) .icon-box{--icon-tint: color-mix(in srgb, var(--rust) 26%, var(--paper-deep));}
  .icon-box svg{width:64px; height:64px; stroke:var(--ink); fill:none; stroke-width:1.6;}
  .era{
    display:inline-block; font-family:'Space Mono', monospace; font-size:0.62rem;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--ink);
    padding:2px 8px; margin-bottom:9px; border:1px solid var(--ink);
  }
  .tag:nth-child(6n+1) .era{background:var(--teal); color:#fff; border-color:var(--teal);}
  .tag:nth-child(6n+2) .era{background:var(--violet); color:#fff; border-color:var(--violet);}
  .tag:nth-child(6n+3) .era{background:var(--mustard); border-color:var(--mustard);}
  .tag:nth-child(6n+4) .era{background:var(--pink); color:#fff; border-color:var(--pink);}
  .tag:nth-child(6n+5) .era{background:var(--blue); color:#fff; border-color:var(--blue);}
  .tag:nth-child(6n+6) .era{background:var(--rust); color:#fff; border-color:var(--rust);}
  .tag .era.actuel{
    background:var(--card);
    color:var(--ink);
    border:1.5px dashed var(--ink);
  }
  .tag h3{font-family:'Archivo',sans-serif; font-weight:700; text-transform:none; font-size:1.02rem; margin-bottom:4px; letter-spacing:0;}
  .tag .desc{font-size:0.82rem; color:var(--ink-soft); margin-bottom:12px; line-height:1.5;}
  .tag .meta{
    font-family:'Space Mono', monospace; font-size:0.72rem;
    display:flex; justify-content:space-between; align-items:center;
    border-top:1px dashed var(--line-strong); padding-top:10px;
  }
  .price{font-weight:700; color:var(--rust);}

  /* ---------- STEPS ---------- */
  .steps{padding:76px 28px; background:var(--paper-deep); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink);}
  .steps-row{display:flex; gap:28px; max-width:920px; margin:0 auto; flex-wrap:wrap;}
  .step{flex:1; min-width:220px; background:var(--card); border:2px solid var(--ink); padding:24px 20px; box-shadow:5px 5px 0 var(--line-strong);}
  .step .num{font-family:'Anton', sans-serif; font-size:2rem; color:var(--rust); margin-bottom:8px;}
  .step:nth-child(1) .num{color:var(--rust);}
  .step:nth-child(2) .num{color:var(--violet);}
  .step:nth-child(3) .num{color:var(--blue);}
  .step h4{font-family:'Archivo',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; font-size:0.92rem; margin-bottom:8px;}
  .step p{font-size:0.86rem; color:var(--ink-soft);}

  /* ---------- SHIPPING ---------- */
  .shipping{padding:76px 28px;}
  .ship-row{display:flex; gap:26px; max-width:860px; margin:0 auto; flex-wrap:wrap;}
  .ship-card{flex:1; min-width:240px; background:var(--card); border:2px solid var(--ink); padding:26px 22px; box-shadow:6px 6px 0 var(--line-strong);}
  .ship-card .tag-label{
    font-family:'Space Mono', monospace; font-size:0.66rem; text-transform:uppercase;
    letter-spacing:0.07em; background:var(--blue); color:#fff;
    display:inline-block; padding:3px 9px; margin-bottom:12px;
  }
  .ship-card.alt .tag-label{background:var(--pink); color:#fff;}
  .ship-card .ship-price{color:var(--blue);}
  .ship-card.alt .ship-price{color:var(--pink);}
  .ship-card h4{font-family:'Archivo',sans-serif; font-weight:700; text-transform:none; letter-spacing:0; font-size:1.15rem; margin-bottom:8px;}
  .ship-card p{font-size:0.88rem; color:var(--ink-soft); margin-bottom:12px;}
  .ship-price{font-family:'Space Mono', monospace; font-weight:700; font-size:1rem; color:var(--rust);}

  /* ---------- FOOTER ---------- */
  footer{
    padding:78px 28px 44px; text-align:center; color:var(--paper); border-top:3px solid var(--ink);
    background:
      radial-gradient(circle at 12% 20%, color-mix(in srgb, var(--pink) 30%, transparent) 0%, transparent 40%),
      radial-gradient(circle at 88% 15%, color-mix(in srgb, var(--blue) 26%, transparent) 0%, transparent 42%),
      radial-gradient(circle at 50% 100%, color-mix(in srgb, var(--violet) 30%, transparent) 0%, transparent 46%),
      var(--ink);
  }
  footer .eyebrow{color:rgba(239,231,214,0.6);}
  footer h2{font-size:clamp(2rem,5vw,3rem); margin:12px 0 14px; color:var(--paper);}
  footer p.lede{color:rgba(239,231,214,0.75); max-width:480px; margin:0 auto 30px;}
  .contact-row{display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}
  footer .btn-solid{background:var(--rust); border-color:var(--rust); color:#fff;}
  footer .btn-solid:hover{background:var(--mustard); border-color:var(--mustard); color:var(--ink);}
  footer .btn-outline{border-color:var(--paper); color:var(--paper);}
  footer .btn-outline:hover{background:rgba(239,231,214,0.1);}
  .fine{margin-top:52px; font-family:'Space Mono', monospace; font-size:0.68rem; color:rgba(239,231,214,0.45); letter-spacing:0.04em;}

  @media (max-width:860px){
    nav{display:none;}
    .hero-inner{grid-template-columns:1fr;}
    .hero-visual{height:320px; margin-top:20px;}
    .look-grid{grid-template-columns:1fr;}
    .look-card{flex-direction:column;}
    .look-photo{border-right:none; border-bottom:2px solid var(--ink); min-height:220px;}
  }

  /* ---------- EDIT MODE ---------- */
  #edit-fab{
    position:fixed; bottom:22px; right:22px; z-index:200;
    font-family:'Space Mono', monospace; font-size:0.78rem; font-weight:700;
    text-transform:uppercase; letter-spacing:0.05em;
    background:var(--ink); color:var(--paper);
    border:2px solid var(--ink); border-radius:30px;
    padding:13px 22px; cursor:pointer;
    box-shadow:4px 4px 0 var(--line-strong);
  }
  #edit-fab:hover{background:var(--rust); border-color:var(--rust);}
  #edit-overlay{
    position:fixed; inset:0; z-index:300;
    background:rgba(10,8,4,0.55);
    display:none;
    align-items:flex-start; justify-content:center;
    padding:34px 16px;
    overflow-y:auto;
  }
  #edit-overlay.open{display:flex;}
  #edit-panel{
    background:var(--paper); color:var(--ink);
    border:3px solid var(--ink);
    box-shadow:8px 8px 0 var(--line-strong);
    max-width:760px; width:100%;
    padding:0;
    font-family:'Archivo', sans-serif;
  }
  #edit-panel-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 24px; border-bottom:3px solid var(--ink);
    position:sticky; top:0; background:var(--paper); z-index:2;
  }
  #edit-panel-head h2{font-size:1.3rem;}
  #edit-close{
    font-family:'Space Mono', monospace; font-size:0.75rem; font-weight:700;
    background:transparent; border:1.5px solid var(--ink); border-radius:3px;
    padding:8px 12px; cursor:pointer; color:var(--ink);
  }
  #edit-close:hover{background:var(--ink); color:var(--paper);}
  #edit-body{padding:22px 24px 30px;}
  .ed-section{margin-bottom:30px; padding-bottom:26px; border-bottom:1px dashed var(--line-strong);}
  .ed-section:last-child{border-bottom:none;}
  .ed-section h3{
    font-family:'Space Mono', monospace; font-size:0.75rem; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:14px;
  }
  .ed-row{display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .ed-field{display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px;}
  .ed-field label{font-family:'Space Mono', monospace; font-size:0.64rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);}
  .ed-field input, .ed-field textarea, .ed-field select{
    font-family:'Archivo', sans-serif; font-size:0.88rem;
    padding:9px 10px; border:1.5px solid var(--ink); border-radius:3px;
    background:var(--card); color:var(--ink);
  }
  .ed-field textarea{resize:vertical; min-height:60px;}
  .ed-check{display:flex; align-items:center; gap:6px; font-size:0.8rem; font-family:'Space Mono', monospace;}
  .ed-check input{width:16px; height:16px;}
  .ed-card{
    background:var(--card); border:1.5px solid var(--ink); border-radius:3px;
    padding:16px; margin-bottom:16px;
  }
  .ed-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .ed-card-head span{font-family:'Space Mono', monospace; font-size:0.72rem; font-weight:700; text-transform:uppercase;}
  .ed-mini-btn{
    font-family:'Space Mono', monospace; font-size:0.64rem; font-weight:700; text-transform:uppercase;
    background:transparent; border:1.5px solid var(--ink); border-radius:3px;
    padding:5px 9px; cursor:pointer; color:var(--ink);
  }
  .ed-mini-btn:hover{background:var(--ink); color:var(--paper);}
  .ed-mini-btn.danger{border-color:var(--rust); color:var(--rust);}
  .ed-mini-btn.danger:hover{background:var(--rust); color:#fff;}
  .ed-add-btn{
    font-family:'Space Mono', monospace; font-size:0.72rem; font-weight:700; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:2px solid var(--ink); border-radius:3px;
    padding:9px 16px; cursor:pointer; width:100%;
  }
  .ed-add-btn:hover{background:var(--rust); border-color:var(--rust);}
  .ed-item-row{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
  .ed-item-row input:first-child{flex:2;}
  .ed-item-row input:nth-child(2){flex:1; max-width:90px;}
  .ed-cats{display:flex; gap:10px; flex-wrap:wrap; margin:6px 0;}
  #edit-panel-foot{
    display:flex; gap:12px; justify-content:flex-end; align-items:center;
    padding:16px 24px; border-top:3px solid var(--ink);
    position:sticky; bottom:0; background:var(--paper);
  }
  #ed-status{font-family:'Space Mono', monospace; font-size:0.75rem; color:var(--ink-soft); margin-right:auto;}
  #ed-status.err{color:var(--rust);}
  #ed-status.ok{color:var(--teal);}
</style>

  </div>
</div>

  }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function attr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
  function waBase(state){
    return "https://wa.me/" + state.contact.whatsapp.replace(/[^0-9]/g,"");
  }
  function waLink(state, text){
    return waBase(state) + "?text=" + encodeURIComponent(text);
  }

  /* ---------------- RENDER: page sections ---------------- */

  function headerHTML(){
    return '<header>'
      + '<div class="brand"><span class="dot"></span>OFF SEASON</div>'
      + '<nav><a href="#looks">Get the Look</a><a href="#catalogue">Catalogue</a><a href="#comment-acheter">Comment acheter</a><a href="#livraison">Livraison</a><a href="#contact">Contact</a></nav>'
      + '</header>';
  }

  function heroHTML(state){
    return '<section class="hero">'
      + '<div class="hero-inner"><div>'
      + '<span class="hero-badge">'+esc(state.hero.badge)+'</span>'
      + '<h1>OFF<br><span class="line2">SEASON</span></h1>'
      + '<span class="marker">l\'archive qu\'on croyait finie</span>'
      + '<p class="lede">'+esc(state.hero.lede)+'</p>'
      + '<div class="cta-row"><a href="#looks" class="btn btn-solid">Voir les looks du shooting</a><a href="#contact" class="btn btn-outline">Suivre sur Instagram</a></div>'
      + '</div>'
      + '<div class="hero-visual">'
      + '<div class="polaroid p1"><div class="frame"><img src="'+HERO_IMG+'" alt="Référence style"></div><div class="cap">look 01</div></div>'
      + '<div class="polaroid p2"><div class="frame"><span>PHOTO SHOOTING<br>À VENIR</span></div><div class="cap">look 02</div></div>'
      + '<div class="polaroid p3"><div class="frame"><span>PHOTO<br>À VENIR</span></div><div class="cap">detail</div></div>'
      + '</div></div></section>';
  }

  function lookCardHTML(look){
    var photoInner;
    if(look.photo === "hero"){
      photoInner = '<img src="'+HERO_IMG+'" alt="Référence style"><span class="ref-badge">Photo de référence — le vrai shooting arrive bientôt</span>';
    } else {
      photoInner = 'PHOTO DU SHOOTING<br>À VENIR';
    }
    var items = look.items.map(function(it){
      return '<li><span class="iname">'+esc(it[0])+'</span><span class="iprice">'+esc(it[1])+'</span></li>';
    }).join('');
    var waText = "Salut ! Je veux le look " + look.title + " d'Off Season";
    return '<div class="look-card'+(look.actuel?' actuel':'')+'">'
      + '<div class="look-photo"><span class="look-num">'+esc(look.num)+'</span>'+photoInner+'</div>'
      + '<div class="look-body">'
      + '<h3 class="look-title">'+esc(look.title)+'</h3>'
      + '<div class="look-sub">'+esc(look.sub)+'</div>'
      + '<ul class="item-list">'+items+'</ul>'
      + '<div class="look-foot"><span class="look-total">Le look complet <b>'+esc(look.total)+'</b></span>'
      + '<a href="'+waLink(STATE, waText)+'" class="btn-mini" target="_blank">Acheter le look</a></div>'
      + '</div></div>';
  }

  function looksHTML(state){
    var cards = state.looks.map(function(l,i){ var withNum = Object.assign({}, l, {num: String(i+1).padStart(2,'0')}); return lookCardHTML(withNum); }).join('');
    return '<section class="looks" id="looks"><div class="wrap">'
      + '<div class="section-head"><span class="eyebrow">Get the look</span><h2>Le shooting, prêt à porter</h2>'
      + '<p>Chaque tenue est disponible en entier ou pièce par pièce. Une seule taille par pièce — une fois vendue, c\'est fini. Les looks en couleur sont vintage, le look en pointillés est en seconde main actuelle.</p></div>'
      + '<div class="look-grid">'+cards+'</div>'
      + '</div></section>';
  }

  function catalogCardHTML(item){
    var eraClass = item.actuel ? ' actuel' : '';
    return '<div class="tag" data-cat="'+item.cats.join(' ')+'">'
      + '<div class="corner"></div>'
      + '<div class="icon-box"><svg viewBox="0 0 100 100">'+(ICONS[item.icon]||ICONS.generic)+'</svg></div>'
      + '<span class="era'+eraClass+'">'+esc(item.era)+'</span>'
      + '<h3>'+esc(item.title)+'</h3>'
      + '<p class="desc">'+esc(item.desc)+'</p>'
      + '<div class="meta"><span>'+esc(item.size)+'</span><span class="price">'+esc(item.price)+'</span></div>'
      + '</div>';
  }

  function catalogHTML(state){
    var cards = state.catalog.map(catalogCardHTML).join('');
    return '<section class="catalog" id="catalogue">'
      + '<div class="section-head"><span class="eyebrow">Le reste du stock</span><h2>Le catalogue de la semaine</h2>'
      + '<p>Vintage rare et seconde main plus récente, avec la même exigence de sélection. Réservations 24h via WhatsApp ou Instagram.</p></div>'
      + '<div class="filters">'
      + '<button class="filter-btn active" data-filter="tout">Tout</button>'
      + CATS.map(function(c){return '<button class="filter-btn" data-filter="'+c+'">'+CAT_LABELS[c]+'</button>';}).join('')
      + '<button class="filter-btn" data-filter="actuel">Seconde main actuelle</button>'
      + '</div>'
      + '<div class="grid" id="grid">'+cards+'</div>'
      + '</section>';
  }

  function stepsHTML(){
    return '<section class="steps" id="comment-acheter"><div class="section-head"><span class="eyebrow">Le process</span><h2>Comment acheter</h2></div>'
      + '<div class="steps-row">'
      + '<div class="step"><div class="num">01</div><h4>Choisis ta pièce ou ton look</h4><p>Parcours le shooting et le catalogue, repère le nom de la pièce ou du look qui te plaît.</p></div>'
      + '<div class="step"><div class="num">02</div><h4>Écris-moi</h4><p>Clique sur "Acheter" — ça ouvre WhatsApp ou Instagram avec ta demande déjà écrite.</p></div>'
      + '<div class="step"><div class="num">03</div><h4>Reçois-la</h4><p>On organise l\'envoi ou la remise en main propre. Paiement à la confirmation.</p></div>'
      + '</div></section>';
  }

  function shippingHTML(state){
    var s = state.shipping;
    return '<section class="shipping" id="livraison"><div class="section-head"><span class="eyebrow">Livraison</span><h2>Livraison</h2><p>Choisis l\'option qui t\'arrange au moment de la réservation.</p></div>'
      + '<div class="ship-row">'
      + '<div class="ship-card"><span class="tag-label">Colissimo</span><h4>Envoi postal</h4><p>Emballage réutilisé, expédié sous 48h après confirmation du paiement. Suivi inclus.</p><span class="ship-price">'+esc(s.postalPrice)+' &middot; '+esc(s.postalNote)+'</span></div>'
      + '<div class="ship-card alt"><span class="tag-label">En personne</span><h4>Livraison en main propre</h4><p>Je me déplace à Annecy, Genève et les environs. On fixe un lieu et un horaire qui t\'arrangent.</p><span class="ship-price">'+esc(s.personalPrice)+' &middot; '+esc(s.personalNote)+'</span></div>'
      + '</div></section>';
  }

  function footerHTML(state){
    var ig = state.contact.instagram.replace(/^@/,'');
    return '<footer id="contact"><span class="eyebrow">Contact</span><h2>On t\'habille d\'archives ?</h2>'
      + '<p class="lede">Je réponds vite — en général en moins d\'un jour. Le shooting arrive bientôt sur Instagram.</p>'
      + '<div class="contact-row">'
      + '<a href="'+waBase(state)+'" target="_blank" class="btn btn-solid">WhatsApp</a>'
      + '<a href="https://instagram.com/'+ig+'" target="_blank" class="btn btn-outline">Instagram</a>'
      + '</div>'
      + '<div class="fine">OFF SEASON — VINTAGE 90S / 2000S &amp; SECONDE MAIN ACTUELLE &middot; PIÈCES UNIQUES &middot; ANNECY / GENÈVE</div>'
      + '</footer>';
  }

  function bodyInnerHTML(state){
    return headerHTML()+heroHTML(state)+looksHTML(state)+catalogHTML(state)+stepsHTML()+shippingHTML(state)+footerHTML(state);
  }

  function renderApp(){
    document.getElementById('app').innerHTML = bodyInnerHTML(STATE);
  }

  /* delegated filter-button behaviour (survives re-renders) */
  document.getElementById('app').addEventListener('click', function(e){
    var btn = e.target.closest('.filter-btn');
    if(!btn) return;
    var grid = btn.closest('.catalog').querySelector('#grid');
    btn.parentNode.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    var filter = btn.dataset.filter;
    grid.querySelectorAll('.tag').forEach(function(card){
      var cats = card.dataset.cat.split(' ');
      card.style.display = (filter === 'tout' || cats.indexOf(filter) > -1) ? '' : 'none';
    });
  });

  /* ---------------- PUBLISH: full document builder ---------------- */

  var STYLE_AND_HEAD = document.head.innerHTML; // title + fonts + <style>, as authored (plus any meta the shell added)
  var HAS_CHARSET = /<meta[^>]+charset/i.test(STYLE_AND_HEAD);

  function buildFullHTML(state){
    var body = '<div id="app">' + bodyInnerHTML(state) + '</div>\n'
      + editModeMarkup()
      + '\n' + stateDataScript(state)
      + '\n<script>'+MAIN_SCRIPT_SOURCE+'</' + 'script>';
    var headExtra = HAS_CHARSET ? '' : '<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
    return '<!doctype html>\n<html lang="fr">\n<head>\n'
      + headExtra + STYLE_AND_HEAD
      + '\n</head>\n<body>\n' + body + '\n</body>\n</html>';
  }

  function editModeMarkup(){
    return '<button id="edit-fab" type="button" hidden>✏️ Editar</button>\n'
      + '<div id="edit-overlay">\n'
      + '  <div id="edit-panel">\n'
      + '    <div id="edit-panel-head">\n'
      + '      <h2>Editar Off Season</h2>\n'
      + '      <button id="edit-close" type="button">Cerrar</button>\n'
      + '    </div>\n'
      + '    <div id="edit-body"></div>\n'
      + '    <div id="edit-panel-foot">\n'
      + '      <span id="ed-status"></span>\n'
      + '      <button class="btn-mini" id="ed-cancel" type="button">Cancelar</button>\n'
      + '      <button class="btn btn-solid" id="ed-save" type="button" style="padding:10px 20px;">Guardar cambios</button>\n'
      + '    </div>\n'
      + '  </div>\n'
      + '</div>';
  }

  /* ---------------- EDIT PANEL ---------------- */

  var fab = document.getElementById('edit-fab');
  var overlay = document.getElementById('edit-overlay');
  var body = document.getElementById('edit-body');
  var statusEl = document.getElementById('ed-status');

  function openPanel(){
    draft = JSON.parse(JSON.stringify(STATE));
    renderPanel();
    overlay.classList.add('open');
    statusEl.textContent = '';
    statusEl.className = '';
  }
  function closePanel(){ overlay.classList.remove('open'); }

  function setPath(obj, path, value){
    var parts = path.split('.');
    var cur = obj;
    for(var i=0;i<parts.length-1;i++){ cur = cur[isNaN(parts[i]) ? parts[i] : parseInt(parts[i],10)]; }
    var last = parts[parts.length-1];
    cur[isNaN(last) ? last : parseInt(last,10)] = value;
  }

  function renderPanel(){
    var html = '';

    html += '<div class="ed-section"><h3>Hero</h3>'
      + '<div class="ed-field"><label>Frase destacada</label><input data-bind="hero.badge" value="'+attr(draft.hero.badge)+'"></div>'
      + '<div class="ed-field" style="margin-top:8px;"><label>Texto principal</label><textarea data-bind="hero.lede">'+esc(draft.hero.lede)+'</textarea></div>'
      + '</div>';

    html += '<div class="ed-section"><h3>Contacto</h3><div class="ed-row">'
      + '<div class="ed-field"><label>WhatsApp (solo números, con código país)</label><input data-bind="contact.whatsapp" value="'+attr(draft.contact.whatsapp)+'"></div>'
      + '<div class="ed-field"><label>Instagram (sin @)</label><input data-bind="contact.instagram" value="'+attr(draft.contact.instagram)+'"></div>'
      + '</div></div>';

    html += '<div class="ed-section"><h3>Envío</h3><div class="ed-row">'
      + '<div class="ed-field"><label>Precio Colissimo</label><input data-bind="shipping.postalPrice" value="'+attr(draft.shipping.postalPrice)+'"></div>'
      + '<div class="ed-field"><label>Nota Colissimo</label><input data-bind="shipping.postalNote" value="'+attr(draft.shipping.postalNote)+'"></div>'
      + '</div><div class="ed-row">'
      + '<div class="ed-field"><label>Precio en persona</label><input data-bind="shipping.personalPrice" value="'+attr(draft.shipping.personalPrice)+'"></div>'
      + '<div class="ed-field"><label>Zona en persona</label><input data-bind="shipping.personalNote" value="'+attr(draft.shipping.personalNote)+'"></div>'
      + '</div></div>';

    html += '<div class="ed-section"><h3>Looks del shooting (Get the Look)</h3><div id="ed-looks"></div>'
      + '<button class="ed-add-btn" id="ed-add-look" type="button">+ Añadir look</button></div>';

    html += '<div class="ed-section"><h3>Catálogo</h3><div id="ed-catalog"></div>'
      + '<button class="ed-add-btn" id="ed-add-item" type="button">+ Añadir pieza</button></div>';

    body.innerHTML = html;
    renderPanelLooks();
    renderPanelCatalog();

    document.getElementById('ed-add-look').onclick = function(){
      draft.looks.push({title:"Nuevo look", sub:"", actuel:false, photo:"none", items:[["Pieza","0€"]], total:"0€"});
      renderPanelLooks();
    };
    document.getElementById('ed-add-item').onclick = function(){
      draft.catalog.push({era:"Années 2000", title:"Nueva pieza", desc:"", size:"Taille unique", price:"0€", cats:["accessoires"], actuel:false, icon:"generic"});
      renderPanelCatalog();
    };
  }

  function renderPanelLooks(){
    var wrap = document.getElementById('ed-looks');
    wrap.innerHTML = draft.looks.map(function(look, i){
      var items = look.items.map(function(it, j){
        return '<div class="ed-item-row">'
          + '<input data-look="'+i+'" data-item="'+j+'" data-field="name" value="'+attr(it[0])+'" placeholder="Pieza">'
          + '<input data-look="'+i+'" data-item="'+j+'" data-field="price" value="'+attr(it[1])+'" placeholder="Precio">'
          + '<button class="ed-mini-btn danger" type="button" data-rmitem="'+i+':'+j+'">✕</button>'
          + '</div>';
      }).join('');
      return '<div class="ed-card" data-lookcard="'+i+'">'
        + '<div class="ed-card-head"><span>Look 0'+(i+1)+'</span><button class="ed-mini-btn danger" type="button" data-rmlook="'+i+'">Eliminar look</button></div>'
        + '<div class="ed-row">'
        + '<div class="ed-field"><label>Nombre del look</label><input data-look="'+i+'" data-field="title" value="'+attr(look.title)+'"></div>'
        + '<div class="ed-field"><label>Subtítulo (talla, tipo)</label><input data-look="'+i+'" data-field="sub" value="'+attr(look.sub)+'"></div>'
        + '</div>'
        + '<label class="ed-check" style="margin-bottom:8px;"><input type="checkbox" data-look="'+i+'" data-field="actuel" '+(look.actuel?'checked':'')+'> Es de segunda mano actual (estilo punteado, look ancho completo)</label>'
        + '<div style="margin-bottom:6px; font-family:\'Space Mono\',monospace; font-size:0.64rem; text-transform:uppercase; color:var(--ink-soft);">Piezas del look</div>'
        + items
        + '<button class="ed-mini-btn" type="button" data-additem="'+i+'" style="margin:6px 0 10px;">+ Añadir pieza al look</button>'
        + '<div class="ed-field"><label>Precio total del look completo</label><input data-look="'+i+'" data-field="total" value="'+attr(look.total)+'" style="max-width:140px;"></div>'
        + '</div>';
    }).join('');

    wrap.querySelectorAll('input[data-look]:not([data-item])').forEach(function(inp){
      inp.addEventListener('input', function(){
        var i = parseInt(inp.dataset.look,10), f = inp.dataset.field;
        draft.looks[i][f] = inp.type === 'checkbox' ? inp.checked : inp.value;
      });
      inp.addEventListener('change', function(){
        if(inp.type === 'checkbox'){ draft.looks[parseInt(inp.dataset.look,10)][inp.dataset.field] = inp.checked; }
      });
    });
    wrap.querySelectorAll('input[data-item]').forEach(function(inp){
      inp.addEventListener('input', function(){
        var i = parseInt(inp.dataset.look,10), j = parseInt(inp.dataset.item,10), f = inp.dataset.field;
        draft.looks[i].items[j][f === 'name' ? 0 : 1] = inp.value;
      });
    });
    wrap.querySelectorAll('[data-rmitem]').forEach(function(b){
      b.addEventListener('click', function(){
        var parts = b.dataset.rmitem.split(':');
        draft.looks[parseInt(parts[0],10)].items.splice(parseInt(parts[1],10),1);
        renderPanelLooks();
      });
    });
    wrap.querySelectorAll('[data-rmlook]').forEach(function(b){
      b.addEventListener('click', function(){
        draft.looks.splice(parseInt(b.dataset.rmlook,10),1);
        renderPanelLooks();
      });
    });
    wrap.querySelectorAll('[data-additem]').forEach(function(b){
      b.addEventListener('click', function(){
        draft.looks[parseInt(b.dataset.additem,10)].items.push(["Pieza","0€"]);
        renderPanelLooks();
      });
    });
  }

  function renderPanelCatalog(){
    var wrap = document.getElementById('ed-catalog');
    wrap.innerHTML = draft.catalog.map(function(item, i){
      var iconOpts = Object.keys(ICON_LABELS).map(function(k){
        return '<option value="'+k+'" '+(item.icon===k?'selected':'')+'>'+ICON_LABELS[k]+'</option>';
      }).join('');
      var catChecks = CATS.map(function(c){
        var checked = item.cats.indexOf(c) > -1 ? 'checked' : '';
        return '<label class="ed-check"><input type="checkbox" data-cat-item="'+i+'" data-cat-val="'+c+'" '+checked+'> '+CAT_LABELS[c]+'</label>';
      }).join('');
      return '<div class="ed-card" data-catcard="'+i+'">'
        + '<div class="ed-card-head"><span>Pieza '+(i+1)+'</span><button class="ed-mini-btn danger" type="button" data-rmcat="'+i+'">Eliminar</button></div>'
        + '<div class="ed-row">'
        + '<div class="ed-field"><label>Nombre</label><input data-cat="'+i+'" data-field="title" value="'+attr(item.title)+'"></div>'
        + '<div class="ed-field"><label>Precio</label><input data-cat="'+i+'" data-field="price" value="'+attr(item.price)+'" style="max-width:110px;"></div>'
        + '</div>'
        + '<div class="ed-field" style="margin-bottom:8px;"><label>Descripción</label><textarea data-cat="'+i+'" data-field="desc">'+esc(item.desc)+'</textarea></div>'
        + '<div class="ed-row">'
        + '<div class="ed-field"><label>Talla</label><input data-cat="'+i+'" data-field="size" value="'+attr(item.size)+'"></div>'
        + '<div class="ed-field"><label>Etiqueta de época</label><input data-cat="'+i+'" data-field="era" value="'+attr(item.era)+'"></div>'
        + '<div class="ed-field"><label>Ícono</label><select data-cat="'+i+'" data-field="icon">'+iconOpts+'</select></div>'
        + '</div>'
        + '<label class="ed-check" style="margin:6px 0;"><input type="checkbox" data-cat="'+i+'" data-field="actuel" '+(item.actuel?'checked':'')+'> Es segunda mano actual (etiqueta punteada)</label>'
        + '<div class="ed-cats">'+catChecks+'</div>'
        + '</div>';
    }).join('');

    wrap.querySelectorAll('input[data-cat]:not([data-cat-item]), textarea[data-cat], select[data-cat]').forEach(function(inp){
      var ev = (inp.tagName==='SELECT' || inp.type==='checkbox') ? 'change' : 'input';
      inp.addEventListener(ev, function(){
        var i = parseInt(inp.dataset.cat,10), f = inp.dataset.field;
        var val = inp.type === 'checkbox' ? inp.checked : inp.value;
        draft.catalog[i][f] = val;
        if(f === 'actuel'){
          var cats = draft.catalog[i].cats, idx = cats.indexOf('actuel');
          if(val && idx === -1) cats.push('actuel');
          if(!val && idx > -1) cats.splice(idx,1);
        }
      });
    });
    wrap.querySelectorAll('[data-cat-item]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var i = parseInt(cb.dataset.catItem,10), v = cb.dataset.catVal;
        var cats = draft.catalog[i].cats;
        var idx = cats.indexOf(v);
        if(cb.checked && idx === -1) cats.push(v);
        if(!cb.checked && idx > -1) cats.splice(idx,1);
      });
    });
    wrap.querySelectorAll('[data-rmcat]').forEach(function(b){
      b.addEventListener('click', function(){
        draft.catalog.splice(parseInt(b.dataset.rmcat,10),1);
        renderPanelCatalog();
      });
    });
  }

  document.getElementById('edit-body').addEventListener('input', function(e){
    var t = e.target;
    if(t.dataset.bind){ setPath(draft, t.dataset.bind, t.value); }
  });

  fab.addEventListener('click', openPanel);
  document.getElementById('edit-close').addEventListener('click', closePanel);
  document.getElementById('ed-cancel').addEventListener('click', closePanel);

  document.getElementById('ed-save').addEventListener('click', function(){
    STATE = JSON.parse(JSON.stringify(draft));
    renderApp();
    statusEl.className = '';
    statusEl.textContent = 'Guardando…';
    if(!artifactNS){
      statusEl.className = 'err';
      statusEl.textContent = 'Modo edición no disponible en esta vista.';
      return;
    }
    artifactNS.publish(buildFullHTML(STATE)).then(function(){
      statusEl.className = 'ok';
      statusEl.textContent = 'Guardado ✓';
    }).catch(function(err){
      if(err && err.code === 'conflict'){
        statusEl.className='err'; statusEl.textContent = 'Alguien más actualizó la página — recargando…';
        return;
      }
      if(err && (err.code === 'not_writer' || err.code === 'not_granted')){
        statusEl.className='err'; statusEl.textContent = 'No tienes permiso de edición en esta vista.';
        fab.hidden = true;
        return;
      }
      statusEl.className='err';
      statusEl.textContent = 'No se pudo guardar (' + (err && err.code ? err.code : 'error') + '). Intenta de nuevo.';
    });
  });

  /* ---------------- INIT ---------------- */

  renderApp();

  var artifactNS = null;
  if(window.claude && window.claude.use){
    window.claude.use('artifact').then(function(ns){
      artifactNS = ns;
      if(ns){ fab.hidden = false; }
    }).catch(function(){});
  }
})();
</script>
